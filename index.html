<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Youth Alpha 🎄</title>
  <meta name="theme-color" content="#0b1030">
  <meta name="description" content="Youth Alpha — คะแนนและอันดับ คริสต์มาส">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=45">
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <canvas id="snow" aria-hidden="true"></canvas>
  <div id="cssSnow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="top-left">
      <a class="brand" href="#/"><span class="brand-tree">🎄</span><span>Youth Alpha</span></a>
    </div>
    <div class="top-actions">
      <button id="langBtn" class="icon-btn" aria-label="Language">EN</button>
      <button id="themeBtn" class="icon-btn" aria-label="Theme">🎨</button>
      <button id="musicBtn" class="icon-btn" aria-label="Music">🔇</button>
    </div>
  </header>

  <aside id="adminSide" class="admin-side" hidden></aside>
  <div id="previewBanner" class="preview-banner" hidden></div>
  <div id="offBar" class="off-bar" hidden></div>
  <main id="view" tabindex="-1"></main>

  <nav id="kidNav" class="kid-nav">
    <a href="#/" data-nav="rank"><span>🏆</span><b data-t="ranking"></b></a>
    <a href="#/songs" data-nav="songs"><span>🎵</span><b data-t="songs"></b></a>
    <a href="#/shop" data-nav="shop"><span>🎁</span><b data-t="shop"></b></a>
    <a href="#/menu" data-nav="menu"><span>☰</span><b data-t="menu"></b></a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="errBar" class="err-bar" role="alert" hidden></div>
  <dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
  <div id="kidSheet" class="kid-sheet" hidden></div>
  <div id="tour" class="tour" hidden></div>

  <script>/* v35 phone preview (?demo=1): sample data only. Swap the phone storage for an in-memory copy before any app code runs,
     so the preview never reads or changes this phone's real saved data (it starts fresh every time it is opened). */
    if (/[?&]demo=1(&|$)/.test(location.search)) {
      window.YA_DEMO = 1;
      const mem = () => Object.create({ getItem(k) { return Object.prototype.hasOwnProperty.call(this, k) ? this[k] : null; },
        setItem(k, v) { this[k] = String(v); }, removeItem(k) { delete this[k]; }, clear() { Object.keys(this).forEach(k => delete this[k]); },
        key(i) { return Object.keys(this)[i] ?? null; }, get length() { return Object.keys(this).length; } });
      const ls = mem(); ls.ya_tour = JSON.stringify({ done: true, last: Date.now(), n: 0 });
      try { Object.defineProperty(window, 'localStorage', { value: ls, configurable: true }); Object.defineProperty(window, 'sessionStorage', { value: mem(), configurable: true }); }
      catch (e) { window.YA_DEMO_UNSAFE = 1; }
    }</script>
  <script>/* a sign-in link from email puts the session in the address (#access_token=…); remember that before it is cleared */
    window.YA_LINK = /(^#|&)(access_token|error_description)=/.test(location.hash) ? location.hash.slice(0, 40) : '';</script>
  <script src="config.js?v=45"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
  <script type="module" src="js/app.js?v=45"></script>
</body>
</html>
